<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Piano</title>
    <meta name="description" content="A playable piano in the browser: multi-touch keys, four synth sounds, a recorder and a learn mode for simple melodies. No install, no sign-up.">
    <meta name="theme-color" content="#0f172a">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Web Piano">
    <meta property="og:description" content="A playable piano in the browser: multi-touch keys, four synth sounds, a recorder and a learn mode for simple melodies.">
    <meta property="og:url" content="https://celaldrg.github.io/piano/">
    <meta property="og:image" content="https://celaldrg.github.io/piano/docs/screenshot.png">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e293b'/%3E%3Cg fill='%23f8fafc'%3E%3Crect x='10' y='12' width='10' height='40' rx='2'/%3E%3Crect x='21' y='12' width='10' height='40' rx='2'/%3E%3Crect x='32' y='12' width='10' height='40' rx='2'/%3E%3Crect x='43' y='12' width='10' height='40' rx='2'/%3E%3C/g%3E%3Crect x='17' y='12' width='8' height='24' rx='1.5' fill='%230f172a'/%3E%3Crect x='28' y='12' width='8' height='24' rx='1.5' fill='%23e879f9'/%3E%3Crect x='39' y='12' width='8' height='24' rx='1.5' fill='%230f172a'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <h1 class="brand">
          <svg class="brand__logo" viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#1e293b" />
            <g fill="#f8fafc">
              <rect x="10" y="12" width="10" height="40" rx="2" />
              <rect x="21" y="12" width="10" height="40" rx="2" />
              <rect x="32" y="12" width="10" height="40" rx="2" />
              <rect x="43" y="12" width="10" height="40" rx="2" />
            </g>
            <rect x="17" y="12" width="8" height="24" rx="1.5" fill="#0f172a" />
            <rect x="28" y="12" width="8" height="24" rx="1.5" fill="#e879f9" />
            <rect x="39" y="12" width="8" height="24" rx="1.5" fill="#0f172a" />
          </svg>
          <span data-i18n="app.title">Web Piano</span>
        </h1>
        <button id="lang-toggle" class="btn btn--lang" type="button" aria-label="TR – switch to Turkish" data-i18n="lang.button" data-i18n-label="lang.switch">TR</button>
      </header>

      <main class="main">
        <section class="card stage" aria-label="Piano" data-i18n-label="stage.label">
          <div class="controls">
            <div class="field field--instrument">
              <label class="field__label" for="instrument" data-i18n="control.instrument">Instrument</label>
              <select id="instrument" class="select"></select>
            </div>
            <div class="field field--volume">
              <div class="field__label">
                <label for="volume" data-i18n="control.volume">Volume</label>
                <output id="volume-value" for="volume">80%</output>
              </div>
              <input id="volume" class="range" type="range" min="0" max="100" step="1" value="80">
            </div>
            <div class="field field--octave">
              <span id="octave-label" class="field__label" data-i18n="control.octave">Octave</span>
              <div class="stepper" role="group" aria-labelledby="octave-label">
                <button id="octave-down" class="btn btn--icon" type="button" aria-label="Octave down" data-i18n-label="control.octaveDown">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
                </button>
                <output id="octave-range" class="stepper__value" aria-live="polite"></output>
                <button id="octave-up" class="btn btn--icon" type="button" aria-label="Octave up" data-i18n-label="control.octaveUp">
                  <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" /></svg>
                </button>
              </div>
            </div>
            <div class="toggles">
              <button id="sustain" class="btn btn--toggle" type="button" aria-pressed="false">
                <span data-i18n="control.sustain">Sustain</span>
                <kbd class="kbd" aria-hidden="true" data-i18n="control.sustainKey">Space</kbd>
              </button>
              <button id="labels" class="btn btn--toggle" type="button" aria-pressed="true">
                <span data-i18n="control.labels">Labels</span>
              </button>
            </div>
          </div>

          <div class="display">
            <div id="readout" class="readout" hidden>
              <span id="readout-note" class="readout__note"></span>
              <span id="readout-hz" class="readout__hz"></span>
            </div>
            <ol id="trail" class="trail" aria-label="Recent notes" data-i18n-label="trail.label" hidden></ol>
            <p id="trail-empty" class="trail-empty" data-i18n="trail.empty">Tap a key or use your computer keyboard</p>
          </div>

          <div class="keybed">
            <div id="keys" class="keys" role="group" aria-label="Piano keys" data-i18n-label="keys.label"></div>
          </div>
          <p class="help" data-i18n="help.keys">Computer keys: Z S X D C V G B H N J M lower octave · Q 2 W 3 E R 5 T 6 Y 7 U I O P upper octave · hold Space to sustain · ← → change octave</p>
        </section>

        <div class="panels">
          <section class="card panel" aria-labelledby="rec-title">
            <h2 id="rec-title" class="panel__title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="4" fill="currentColor" /></svg>
              <span data-i18n="rec.title">Recorder</span>
            </h2>
            <div class="transport">
              <button id="rec-record" class="btn btn--record" type="button" aria-pressed="false">
                <svg class="icon icon--record" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="currentColor" /></svg>
                <span data-i18n="rec.record">Record</span>
              </button>
              <button id="rec-stop" class="btn" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z" fill="currentColor" /></svg>
                <span data-i18n="rec.stop">Stop</span>
              </button>
              <button id="rec-play" class="btn" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" /></svg>
                <span data-i18n="rec.play">Play</span>
              </button>
              <button id="rec-clear" class="btn btn--clear" type="button" disabled>
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5h6M4.5 7.5h15M6.5 7.5l.9 11.1a1.5 1.5 0 0 0 1.5 1.4h6.2a1.5 1.5 0 0 0 1.5-1.4l.9-11.1M10 11v5.5M14 11v5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span id="rec-clear-label">Clear</span>
              </button>
            </div>
            <p id="rec-status" class="status"></p>
            <h3 id="takes-title" class="subhead" data-i18n="rec.takes" hidden>Saved takes</h3>
            <ul id="takes" class="takes"></ul>
          </section>

          <section class="card panel" aria-labelledby="mel-title">
            <h2 id="mel-title" class="panel__title">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /><circle cx="6.5" cy="17.5" r="2.5" fill="currentColor" /><circle cx="16.5" cy="15.5" r="2.5" fill="currentColor" /></svg>
              <span data-i18n="mel.title">Melodies</span>
            </h2>
            <div class="melody-row">
              <label class="visually-hidden" for="melody" data-i18n="mel.pick">Melody</label>
              <select id="melody" class="select"></select>
              <button id="mel-play" class="btn" type="button">
                <svg class="icon icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor" /></svg>
                <svg class="icon icon--stop" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1z" fill="currentColor" /></svg>
                <span id="mel-play-label">Play</span>
              </button>
              <button id="mel-learn" class="btn" type="button">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" /><circle cx="12" cy="12" r="3.2" fill="currentColor" /></svg>
                <span id="mel-learn-label">Learn</span>
              </button>
            </div>
            <div id="learn-progress" class="progress" role="progressbar" aria-label="Lesson progress" data-i18n-label="learn.progressLabel" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" hidden>
              <span class="progress__bar"></span>
            </div>
            <p id="mel-status" class="status" aria-live="polite"></p>
            <p id="mel-detail" class="detail" hidden></p>
          </section>
        </div>
      </main>

      <footer class="footer">
        <a href="https://github.com/celaldrg/piano" data-i18n="footer.source">MIT · Source on GitHub</a>
      </footer>
    </div>
  </body>
</html>
